  <text x="80" y="650" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="400" fill="#9ca3af">Keep it short and scannable.</text>
  <rect x="80" y="700" width="120" height="4" rx="2" fill="#2dd4bf"/>
  <!-- Content card area -->
  <rect x="80" y="760" width="920" height="800" rx="24" fill="#232334" stroke="rgba(255,255,255,0.1)"/>
  <text x="540" y="1180" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#71717a">Screenshot � stat � or quote</text>
