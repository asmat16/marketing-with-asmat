  <rect x="280" y="1680" width="520" height="72" rx="36" fill="#2dd4bf"/>
  <text x="540" y="1726" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#09090b">Book a free strategy call</text>
  <text x="540" y="1820" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#71717a">marketingwithasmat.pro</text>
