<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" fill="none">
  <defs>
    <pattern id="grid-story" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <linearGradient id="topGlow" x1="540" y1="0" x2="540" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#14141f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="#14141f"/>
  <rect width="1080" height="1920" fill="url(#grid-story)"/>
  <rect width="1080" height="600" fill="url(#topGlow)"/>
  <text text-anchor="middle" font-family="Inter, system-ui, sans-serif">
