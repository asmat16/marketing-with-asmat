    <tspan font-size="20" font-weight="400" fill="#71717a">with</tspan>
    <tspan x="540" y="268" font-size="48" font-weight="700" fill="#2dd4bf" letter-spacing="0.14em">ASMAT</tspan>
  </text>
  <text x="80" y="520" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="700" fill="#f4f4f5">Headline</text>
