<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Cost per lead versus cost per booked appointment">
  <defs>
    <linearGradient id="bgCpl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141f"/>
      <stop offset="0.5" stop-color="#1a1f2c"/>
      <stop offset="1" stop-color="#1c2438"/>
    </linearGradient>
    <radialGradient id="glowCpl" cx="0.85" cy="0.14" r="0.9">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgCpl)"/>
  <rect width="1200" height="630" fill="url(#glowCpl)"/>
  <g transform="translate(80,80)">
    <circle cx="6" cy="8" r="6" fill="#2dd4bf"/>
    <text x="24" y="14" font-family="system-ui, Arial, sans-serif" font-size="24" font-weight="600" fill="#2dd4bf">Marketing with Asmat</text>
  </g>
  <g transform="translate(920,230)">
    <rect x="0" y="70" width="70" height="110" rx="8" fill="#3f3f52"/>
    <rect x="90" y="20" width="70" height="160" rx="8" fill="#2dd4bf"/>
    <text x="10" y="200" font-family="system-ui, Arial, sans-serif" font-size="16" fill="#a1a1aa">CPL</text>
    <text x="92" y="200" font-family="system-ui, Arial, sans-serif" font-size="16" fill="#5eead4">Booked</text>
  </g>
  <text x="80" y="286" font-family="system-ui, Arial, sans-serif" font-size="36" font-weight="600" fill="#5eead4">Local Lead Quality</text>
  <text x="80" y="362" font-family="system-ui, Arial, sans-serif" font-size="48" font-weight="700" fill="#fafafa">Watch Booked Appointments</text>
  <text x="80" y="470" font-family="system-ui, Arial, sans-serif" font-size="26" font-weight="500" fill="#a1a1aa">CPL is not the goal. Calendar is the goal.</text>
</svg>
